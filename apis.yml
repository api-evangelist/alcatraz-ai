apis:
- aid: alcatraz-ai:admin-portal-api
  name: Alcatraz Admin Portal API
  description: 'Customer-facing REST API for the Alcatraz Admin Portal, used by third-party
    projects and applications to administer Rock devices, users, profiles and events.
    Access is authorized with an API key generated in the Admin Portal (Accounts >
    Account Settings > API Keys) and passed in the x-alcatraz-api-key header. The
    endpoint reference is published only inside the authenticated Admin Portal via
    its API Docs button; the vendor directs everyone else to their Alcatraz AI account
    manager.'
  humanURL: https://support.alcatraz.ai/api-keys
  baseURL: https://platform.alcatraz.ai/api/v2/
