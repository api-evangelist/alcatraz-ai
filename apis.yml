aid: alcatraz-ai
name: Alcatraz AI
description: 'Alcatraz AI, Inc. builds privacy-first facial authentication for enterprise
  physical access control, replacing badges, cards and PINs with the face. Its flagship
  edge device, Rock X, installs in-line between any Wiegand or OSDP reader and an existing
  access control system and authenticates people in real time at the edge without storing
  or transmitting a facial image. Founded in 2016 in Cupertino, California, the company
  pioneered Facial-Authentication-as-a-Service (FAaaS) and layers tailgating detection,
  3D liveness, ONVIF video-at-the-door and SIP intercom onto a single reader, managed
  through a cloud or on-premises Admin Portal with native C-CURE and Genetec integrations
  and a customer-facing REST API secured with an x-alcatraz-api-key header.'
